<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Host | Nexada Meet</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/style.css"></head>
<body><div class="wrap">
<nav><div class="brand"><img src="/logo.png" alt=""> Nexada Meet</div><span id="gstat" class="pill">Google Calendar: checking...</span></nav>
<div class="grid">
 <div class="card">
  <h2>Start now</h2><p class="sub">Opens the room right now. Share the guest link with anyone you want to join (valid 4 hours).</p>
  <div class="row"><button class="btn" id="start">Start meeting</button><button class="btn ghost" id="copy">Copy guest link</button></div>
  <div id="gbox" style="margin-top:22px"></div>
 </div>
 <form class="card" id="form">
  <h2>Schedule and invite</h2><p class="sub">Sends a designed email from meet@nexada.co with a calendar invite.</p>
  <label>Title</label><input id="title" required placeholder="Project kickoff">
  <label>Date and time</label><input id="start" type="datetime-local" required>
  <label>Timezone</label><select id="tz"></select>
  <label>Duration</label><select id="dur"><option>15</option><option selected>30</option><option>45</option><option>60</option><option>90</option></select>
  <label>Guest emails (comma separated)</label><input id="att" required placeholder="john@company.com, anna@company.com">
  <label>Your name</label><input id="host" value="Nexada">
  <label>Notes (optional)</label><textarea id="desc" rows="3"></textarea>
  <div class="row"><button class="btn" id="go">Send invites</button></div>
  <div id="out"></div>
 </form>
</div></div>
<script>
const $=id=>document.getElementById(id);
(function(){
  const local=Intl.DateTimeFormat().resolvedOptions().timeZone;
  const common=['Asia/Dubai','Europe/Rome','Europe/London','Europe/Paris','America/New_York','America/Chicago','America/Los_Angeles','Asia/Riyadh','Asia/Kolkata','Asia/Singapore','Australia/Sydney','UTC'];
  let all=[];try{all=Intl.supportedValuesOf('timeZone')}catch(e){}
  const list=[...new Set([local,...common,...all])];
  $('tz').innerHTML=list.map(z=>`<option value="${z}">${z.replace(/_/g,' ')}</option>`).join('');
  $('tz').value=local;
})();
function offsetMs(ms,tz){
  const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(ms)).map(x=>[x.type,x.value]));
  return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(ms/1000)*1000;
}
function zonedToUtc(str,tz){
  const [d,t]=str.split('T');const [y,mo,da]=d.split('-').map(Number);const [h,mi]=t.split(':').map(Number);
  const guess=Date.UTC(y,mo-1,da,h,mi);
  let ms=guess-offsetMs(guess,tz);
  ms=guess-offsetMs(ms,tz);
  return new Date(ms);
}
$('start').onclick=async()=>{const d=await (await fetch('/api/instant')).json();location.href=d.hostUrl};
$('copy').onclick=async()=>{const d=await (await fetch('/api/instant')).json();try{await navigator.clipboard.writeText(d.guestUrl);$('copy').textContent='Copied'}catch(e){prompt('Copy this link',d.guestUrl)}};
fetch('/api/status').then(r=>r.json()).then(s=>{
  $('gstat').textContent='Google Calendar: '+(s.google?'connected':'not connected');
  $('gstat').className='pill'+(s.google?' ok':'');
  if(!s.google) $('gbox').innerHTML=s.googleConfigured?'<a class="btn ghost" href="/auth/google">Connect Google Calendar</a>':'<p class="sub">Add GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET to enable Google Calendar sync. Emails still include an Add to Calendar link.</p>';
});
$('form').onsubmit=async e=>{
  e.preventDefault(); $('go').disabled=true; $('out').innerHTML='';
  const body={title:$('title').value,start:zonedToUtc($('start').value,$('tz').value).toISOString(),durationMin:+$('dur').value,
    attendees:$('att').value.split(/[,;\s]+/).filter(Boolean),hostName:$('host').value,description:$('desc').value,
    tz:$('tz').value};
  try{
    const r=await fetch('/api/schedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json(); if(!r.ok) throw new Error(d.error);
    let t=d.results.map(x=>(x.ok?'Sent to ':'Failed for ')+x.to+(x.error?': '+x.error:'')).join('\n');
    if(d.calendarLink) t+='\nAdded to Google Calendar';
    if(d.calendarError) t+='\nGoogle Calendar error: '+d.calendarError;
    $('out').innerHTML='<div class="msg"></div>'; $('out').firstChild.textContent=t;
  }catch(err){ $('out').innerHTML='<div class="msg"></div>'; $('out').firstChild.textContent='Error: '+err.message }
  $('go').disabled=false;
};
</script></body></html>
