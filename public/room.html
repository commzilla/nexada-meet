<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexada Meet</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/style.css"></head>
<body><div class="roomwrap">
<header><div class="brand"><img src="/logo.png" alt=""> Nexada Meet</div><a href="/" class="btn ghost" style="padding:8px 16px;font-size:14px">Leave</a></header>
<iframe id="f" allow="camera; microphone; fullscreen; display-capture; autoplay; clipboard-write" title="Meeting"></iframe>
</div>
<script>
fetch('/api/room').then(r=>r.json()).then(d=>{
  if(d.url) document.getElementById('f').src=d.url;
  else document.body.insertAdjacentHTML('beforeend','<p style="padding:20px">Room unavailable: '+(d.error||'')+'</p>');
});
</script></body></html>
