<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexada Meet</title><link rel="icon" href="/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><meta name="theme-color" content="#07050d"><link rel="stylesheet" href="/style.css"></head>
<body class="room"><div class="roomwrap">
<header class="topbar"><div class="topbar-in">
  <a class="brand"><img src="/logo.png" alt=""><span>Nexada <b>Meet</b></span></a>
  <div class="row" style="margin:0;gap:8px"><button id="invite" class="btn sm" style="display:none">Invite</button><a href="javascript:history.length>1?history.back():window.close()" class="btn ghost sm">Leave</a></div>
</div></header>
<iframe id="f" allow="camera; microphone; fullscreen; display-capture; autoplay; clipboard-write" title="Meeting"></iframe>
</div>
<script>
const f=document.getElementById('f');
function msg(html){document.querySelector('.roomwrap').insertAdjacentHTML('beforeend','<div id="m" style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px"><div class="card" style="max-width:420px">'+html+'</div></div>');f.style.display='none'}
function clear(){const m=document.getElementById('m');if(m)m.remove()}
async function load(){
  const r=await fetch('/api/room'+location.search);
  const d=await r.json().catch(()=>({}));
  if(r.ok&&d.url){clear();f.style.display='';f.src=d.url;return}
  clear();
  if(r.status===425){
    const t=new Date(d.opensAt),st=new Date(d.start);
    const fmt=x=>x.toLocaleString([], {weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    msg('<h2>Meeting not open yet</h2><p class="sub">The meeting starts '+fmt(st)+'.<br>The room opens at '+fmt(t)+' (30 minutes before). This page will join automatically.</p><p class="sub" id="cd"></p>');
    const tick=()=>{const s=Math.max(0,Math.round((d.opensAt-Date.now())/1000));
      const el=document.getElementById('cd'); if(el) el.textContent='Opens in '+(s>=3600?Math.floor(s/3600)+'h ':'')+Math.floor(s%3600/60)+'m '+(s%60)+'s';
      if(s<=0){clearInterval(iv);load()}};
    tick();var iv=setInterval(tick,1000);
  } else msg('<h2>'+(r.status===410?'Meeting ended':'Cannot join')+'</h2><p class="sub">'+(d.message||d.error||'Please use the link from your invitation.')+'</p>');
}
load();
if(new URLSearchParams(location.search).get('o')==='1'){
  const b=document.getElementById('invite');b.style.display='';
  b.onclick=async()=>{
    const d=await (await fetch('/api/guest-link'+location.search)).json();
    if(navigator.share){try{await navigator.share({title:'Join my Nexada Meet call',url:d.url});return}catch(e){}}
    try{await navigator.clipboard.writeText(d.url);b.textContent='Link copied'}catch(e){prompt('Copy this link',d.url)}
  };
}
</script></body></html>
